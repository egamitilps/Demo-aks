# ============================================================================
# GitHub Actions Workflow - Deploy AKS Infrastructure
# ============================================================================
# This workflow deploys the retail store infrastructure to Azure using Bicep
#
# Prerequisites:
#   1. Create an Azure Service Principal:
#      az ad sp create-for-rbac --name "github-actions-sp" --role contributor \
#        --scopes /subscriptions/{subscription-id}/resourceGroups/{rg-name} \
#        --sdk-auth
#
#   2. Add the following secrets to your GitHub repository:
#      - AZURE_CREDENTIALS: The JSON output from step 1
#      - AZURE_SUBSCRIPTION_ID: Your Azure subscription ID
#      - SQL_ADMIN_PASSWORD: The SQL admin password
#
#   3. Update the environment variables below with your values
# ============================================================================

name: Deploy Infrastructure

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

  # Trigger on push to main (optional - comment out if not desired)
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'infra/bicep/**'
  #     - '.github/workflows/deploy-infrastructure.yml'

# Permissions needed for OIDC authentication (alternative to service principal)
permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: 'rg-retail-dev'
  AZURE_LOCATION: 'southcentralus'
  BICEP_FILE: 'infra/bicep/main.bicep'
  PARAMETERS_FILE: 'infra/bicep/parameters/dev.bicepparam'

jobs:
  # ==========================================================================
  # Job 1: Validate Bicep Templates
  # ==========================================================================
  validate:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Bicep file
        run: |
          az bicep build --file ${{ env.BICEP_FILE }}
          echo "✅ Bicep validation successful"

      - name: Run What-If deployment
        run: |
          az deployment group what-if \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters ${{ env.PARAMETERS_FILE }} \
            --parameters sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}

  # ==========================================================================
  # Job 2: Deploy Infrastructure
  # ==========================================================================
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group (if not exists)
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --tags Environment=Development Project=RetailStore ManagedBy=GitHub-Actions

      - name: Deploy Bicep template
        id: deploy
        run: |
          az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters ${{ env.PARAMETERS_FILE }} \
            --parameters sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }} \
            --output json > deployment-output.json

          echo "✅ Deployment successful"

      - name: Save deployment outputs
        run: |
          cat deployment-output.json | jq '.properties.outputs' > outputs.json
          echo "Deployment Outputs:"
          cat outputs.json

      - name: Upload deployment outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs
          path: outputs.json
          retention-days: 30

      - name: Display next steps
        run: |
          NEXT_STEPS=$(cat outputs.json | jq -r '.nextSteps.value')
          echo "$NEXT_STEPS"

  # ==========================================================================
  # Job 3: Post-Deployment Configuration (Optional)
  # ==========================================================================
  post-deploy:
    name: Post-Deployment Setup
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download deployment outputs
        uses: actions/download-artifact@v4
        with:
          name: deployment-outputs

      - name: Get AKS credentials
        run: |
          AKS_NAME=$(cat outputs.json | jq -r '.aksClusterName.value')
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name $AKS_NAME \
            --overwrite-existing

      # NOTE: Application Gateway for Containers is deployed via Bicep
      # ALB Controller installation step (optional, for manual setup):

      # - name: Install ALB Controller
      #   run: |
      #     helm install alb-controller oci://mcr.microsoft.com/application-lb/charts/alb-controller \
      #       --version 1.0.0 \
      #       --set albController.namespace=azure-alb-system \
      #       --namespace azure-alb-system \
      #       --create-namespace

      - name: Deployment Summary
        run: |
          echo "================================================="
          echo "🎉 Deployment Complete!"
          echo "================================================="
          echo ""
          echo "AKS Cluster: $(cat outputs.json | jq -r '.aksClusterName.value')"
          echo "ACR Name: $(cat outputs.json | jq -r '.acrName.value')"
          echo "SQL Server: $(cat outputs.json | jq -r '.sqlServerName.value')"
          echo ""
          echo "For next steps, see: docs/deployment-guide.md"
          echo "================================================="
